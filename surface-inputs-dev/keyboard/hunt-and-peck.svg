    <rect x="136" y="177" width="68" height="32" rx="4"/>
    <rect x="214" y="177" width="68" height="32" rx="4"/>
    <rect x="292" y="177" width="68" height="32" rx="4"/>
    <rect x="370" y="177" width="68" height="32" rx="4"/>
  </g>
