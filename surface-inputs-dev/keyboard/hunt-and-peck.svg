      <path fill="#4db9a5" d="M71 62c0-7 5-12 11-12s11 5 11 12v97c0 7-5 12-11 12s-11-5-11-12z"/>
      <path fill="#f2e8d0" d="M94 67c0-8 5-13 12-13s12 5 12 13v27c0 8-5 13-12 13s-12-5-12-13z"/>
      <path fill="#f2e8d0" d="M115 69c0-7 5-12 11-12s11 5 11 12v22c0 7-5 12-11 12s-11-5-11-12z"/>
      <path fill="#f2e8d0" d="M133 74c0-6 4-10 9-10s9 4 9 10v16c0 6-4 10-9 10s-9-4-9-10z"/>
      <path fill="#f2e8d0" d="M64 76c-8-1-13 4-12 11l3 12c2 6 9 9 14 5 4-3 4-8 1-13z"/>
      <path fill="none" stroke="#6b8da8" stroke-width="2" d="M57 91l10 4"/>
