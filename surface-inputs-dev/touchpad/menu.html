<!doctype html>
<html lang="en" data-task-forms data-path-task="stp_cascading_menu">
<head>
  <style>html{background:#0d1b2a;color-scheme:dark}html.dogfood-loading body{visibility:hidden}</style>
  <script>
    if (new URLSearchParams(location.search).has('dogfood')) {
      document.documentElement.classList.add('dogfood-loading');
      setTimeout(() => {
        if (!document.documentElement.classList.contains('dogfood-loading')) return;
        document.documentElement.classList.add('dogfood-startup-failed');
        const fail = () => {
          if (!document.body) return;
          document.body.replaceChildren();
          const message=document.createElement('p');message.textContent='Dogfooding could not finish loading. Return to the main page and try again.';message.setAttribute('role','alert');
          const home=document.createElement('a');home.href='../index.html';home.textContent='Return to main page';
          document.body.append(message,home);document.documentElement.classList.remove('dogfood-loading');
        };
        if(document.body)fail();else{const observer=new MutationObserver(()=>{if(document.body){observer.disconnect();fail();}});observer.observe(document.documentElement,{childList:true,subtree:true});}
      },10000);
    }
  </script>
  <script src="../dogfood-flow.js?v=menu-flow-3" defer></script>
  <link rel="stylesheet" href="../dogfood-flow.css?v=five-stage-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menus · Surface Inputs Arcade</title>
  <link rel="stylesheet" href="path-tasks.css?v=dev-files-1">
  <link rel="stylesheet" href="../post-task-feedback.css?v=menu-feedback-2">
  <script src="../transport.js?v=stable-sdk-2"></script>
  <script src="../transport-ui.js?v=dual-forms-6"></script>
  <script src="../task-navigation.js?v=home-1" defer></script>
  <script src="../files-forms-config.js?v=task-forms-2"></script>
  <script src="../files-forms.js?v=task-forms-2"></script>
  <script src="../menu-tasks.js?v=menu-1"></script>
  <script src="../path-results.js?v=menu-feedback-2"></script>
  <script src="menu-task.js?v=menu-1" defer></script>
<style>
/* Faithful Arcade canvas. Fixed preflight identity does not resize the original menu layout. */
#menu-participant-group{position:fixed;z-index:1001;top:72px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 48px));padding:16px;border:2px solid var(--border);background:var(--card);color:var(--cream)}
#menu-participant-group[hidden]{display:none}#menu-participant-group label{display:block}#menu-participant{width:100%;padding:8px;margin-top:8px;background:var(--navy);color:var(--cream);border:1px solid var(--border);font:16px var(--body)}#menu-participant-group p{font-size:12px}
#completion.menu-feedback h2{font-family:Arial,sans-serif;line-height:1.45;text-transform:none;letter-spacing:normal}
#completion.menu-feedback textarea{margin:0}
#completion.menu-feedback #completion-status{min-height:0}
#completion.menu-feedback button:disabled{opacity:1}
</style>
</head>
<body oncontextmenu="return false;">
  <header>
    <div class="brand">Surface Inputs <span>Arcade</span></div>
    <h1>Menus</h1>
    <a class="back" id="arcade-task-navigation" href="../index.html">Back to Arcade</a>
  </header>
  <p class="prompt">Select: <strong id="requested-path"></strong> <span class="hint">(follow the gray path)</span></p>
  <div id="menu-participant-group" role="dialog" aria-label="Menu participant label">
    <label for="menu-participant">Web participant label</label>
    <input id="menu-participant" type="text" maxlength="64" autocomplete="off" spellcheck="false">
    <p>Used only for Google Forms. Native attribution stays with the APK.</p>
  </div>
  <div class="stage"><canvas id="menu-canvas" role="img" aria-label="Cascading menu measurement area"></canvas></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="controls">
    <button id="menu-button" type="button">Open menu</button>
    <span id="counts">Selections: 0 · Wrong: 0</span>
    <span id="trial">Path 1 of 2</span>
    <button id="menu-export" type="button" hidden>Export saved results</button>
  </div>

  <div id="completion" class="menu-feedback" data-feedback-dialog hidden>
    <div class="feedback-panel" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="completion-title">
      <h2 id="completion-title">Feedback</h2>
      <form id="completion-form">
        <fieldset>
          <legend>How easy or difficult was this task?</legend>
          <div class="feedback-scale">
            <label><input type="radio" name="ease" value="1"><span class="feedback-value">1</span><span>Very difficult</span></label>
            <label><input type="radio" name="ease" value="2"><span class="feedback-value">2</span><span>Difficult</span></label>
            <label><input type="radio" name="ease" value="3"><span class="feedback-value">3</span><span>Neither easy nor difficult</span></label>
            <label><input type="radio" name="ease" value="4"><span class="feedback-value">4</span><span>Easy</span></label>
            <label><input type="radio" name="ease" value="5"><span class="feedback-value">5</span><span>Very easy</span></label>
          </div>
        </fieldset>
        <label class="feedback-comment-label" for="completion-comment">What worked well, or what could be improved?</label>
        <textarea id="completion-comment" rows="4" maxlength="1024"></textarea>
        <p id="completion-status" role="status" aria-live="polite"></p>
        <div class="feedback-actions">
          <button type="button" id="completion-save">Finish</button>
          <button type="button" id="completion-retry" hidden>Retry native telemetry</button>
          <button type="button" id="completion-forms-retry" hidden>Retry Forms</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
