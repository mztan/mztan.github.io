<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Start the Surface Inputs targeting, scrolling, typing, or menu test.">
  <title>Surface Inputs Arcade</title>
  <script src="../environment.js" defer></script>
  <script src="transport.js"></script>
  <script src="transport-ui.js"></script>
  <style>
    /*
      Directions explored: an authentic Arcade panel, a retro cabinet scoreboard,
      and a compact terminal directory. Selected: the Arcade panel requested here.
      Navy/card surfaces, cream type, red branding and mint interaction accents
      match the app; condensed display type contrasts with readable UI body type.
      Signature: two-line wordmark, flat 2px-edged activity tiles and simple glyphs.
      Anti-model: no gradients, neon glow, oversized hero, decorative score or lives.
      Motion: short border/color feedback, respecting reduced-motion preferences.
      Local font stacks and inline SVG keep the page self-contained.
    */
    :root {
      color-scheme: dark;
      --navy: #0d1b2a;
      --card: #142338;
      --border: #1f3550;
      --cream: #f2e8d0;
      --red: #e63d2e;
      --mint: #4db9a5;
      --muted: #6b8da8;
      --caption: #b4c0cb;
      --display: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", sans-serif;
      --body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .panel { width: 100%; max-width: 860px; }
    header { margin-bottom: 32px; }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(32px, 5vw, 44px);
      font-stretch: condensed;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    h1 span { display: block; color: var(--red); }
    nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .test-link {
      display: flex;
      flex-direction: column;
      min-height: 216px;
      padding: 24px;
      border: 2px solid var(--border);
      border-radius: 2px;
      background: var(--card);
      color: var(--cream);
      text-decoration: none;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .test-icon { width: 48px; height: 48px; margin-bottom: 24px; color: var(--mint); }
    .name {
      display: block;
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .test-link:hover { border-color: var(--red); }
    .test-link:hover .test-icon { color: var(--cream); }
    .test-link:active { background: var(--mint); border-color: var(--cream); color: var(--navy); }
    .test-link:active .test-icon { color: var(--navy); }
    .test-link:focus-visible { outline: 3px solid var(--mint); outline-offset: 4px; }
    @media (max-width: 700px) {
      main { padding: 24px; }
      header { margin-bottom: 24px; }
      nav { grid-template-columns: 1fr; }
      .test-link { min-height: 104px; padding: 20px; position: relative; padding-left: 92px; }
      .test-icon { position: absolute; top: 24px; left: 20px; margin: 0; }
      .name { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .test-link { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <header>
        <h1 id="page-title">Surface Inputs <span>Arcade</span></h1>
      </header>
      <nav aria-label="Surface Inputs tests">
        <a class="test-link" href="touchpad/index.html?session_id=df_202611" aria-labelledby="targeting-title">
          <svg class="test-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <circle cx="17" cy="17" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M26 24L28 42L33 35L42 33L26 24Z" fill="currentColor"/>
          </svg>
          <span class="name" id="targeting-title">Targeting</span>
        </a>
        <a class="test-link" href="touchpad/scroll.html?session_id=df_202611" aria-labelledby="scrolling-title">
          <svg class="test-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <path d="M12 15L20 7L28 15M20 7V33M28 33L36 41L44 33M36 15V41" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
          <span class="name" id="scrolling-title">Scrolling</span>
        </a>
        <a class="test-link" href="keyboard/?setting_preset=df&amp;num_prompts=3&amp;session_id=df_202611" aria-labelledby="typing-title">
          <svg class="test-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <rect x="4" y="11" width="40" height="26" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M11 18H13M19 18H21M27 18H29M35 18H37M11 25H13M19 25H21M27 25H29M35 25H37M15 31H33" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
          <span class="name" id="typing-title">Typing</span>
        </a>
        <a class="test-link" href="touchpad/menu.html" aria-labelledby="menus-title">
          <svg class="test-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <rect x="4" y="8" width="16" height="32" stroke="currentColor" stroke-width="2"/>
            <rect x="24" y="16" width="16" height="16" stroke="currentColor" stroke-width="2"/>
            <path d="M8 16H16M8 24H16M8 32H16M28 24H36" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
          <span class="name" id="menus-title">Menus</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
