<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Start the Surface Inputs targeting, scrolling, or typing test.">
  <title>Surface Inputs</title>
  <style>
    /*
      Directions explored: Swiss utility link hub; a terminal command palette;
      an editorial directory with ruled rows. Selected: the quiet utility hub,
      preserving the compact three-link structure of jasonc.how/si/.
      Color: a neutral white/navy field with high-contrast dark actions.
      Typography: Arial headings and the platform UI face for readable controls.
      Signature: restrained heading, vertically stacked actions, no visual clutter.
      Anti-model: no oversized marketing hero, gradients, decorative icons, or card grid.
      Motion: brief color changes only, disabled for reduced-motion preferences.
      Fonts are local to keep the launcher self-contained and dependency-free.
    */
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #0b1220;
      --muted: #596273;
      --action: #111827;
      --action-hover: #293449;
      --action-text: #ffffff;
      --focus: #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .panel { width: 100%; max-width: 520px; }
    h1 {
      margin: 0 0 20px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.3;
    }
    nav { display: flex; flex-direction: column; gap: 12px; }
    .test-link {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--action);
      color: var(--action-text);
      text-decoration: none;
      font-weight: 500;
      transition: background-color 150ms ease;
    }
    .test-link:hover { background: var(--action-hover); }
    .test-link:active { background: var(--action-hover); }
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }
    footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
    footer a { color: inherit; text-underline-offset: 3px; }
    footer a:hover { color: var(--text); }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #071025;
        --text: #e6eef8;
        --muted: #a4b3c8;
        --action: #1f2937;
        --action-hover: #334155;
        --focus: #93c5fd;
      }
    }
    @media (max-width: 450px) { main { padding: 24px; } }
    @media (prefers-reduced-motion: reduce) { .test-link { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">Surface Inputs</h1>
      <nav aria-label="Surface Inputs tests">
        <a class="test-link" href="touchpad/index.html?session_id=df_202611">Targeting</a>
        <a class="test-link" href="touchpad/scroll.html?session_id=df_202611">Scrolling</a>
        <a class="test-link" href="keyboard/?setting_preset=df&amp;num_prompts=3&amp;session_id=df_202611">Typing</a>
      </nav>
      <footer><a href="https://github.com/mztan/mztan.github.io/tree/main/surface-inputs">View source</a></footer>
    </section>
  </main>
</body>
</html>
